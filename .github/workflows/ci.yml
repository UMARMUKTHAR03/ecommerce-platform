name: BazaarFlow LUXE CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-build:
    name: Backend Test, E2E & Build (NestJS + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: bazaarflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-12345
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy

      - name: Run Database Migrations on PostgreSQL Service
        run: npm run migration:run
        env:
          DATABASE_URL: postgresql://postgres:testpassword123@localhost:5432/bazaarflow_test
          NODE_ENV: test

      - name: Run Backend E2E Integration Tests
        run: npx jest --config ./test/jest-e2e.json --runInBand --verbose
        working-directory: backend
        continue-on-error: true
        id: e2e_step
        env:
          DATABASE_URL: postgresql://postgres:testpassword123@localhost:5432/bazaarflow_test
          NODE_ENV: test
          RUN_E2E: 'true'
          JWT_SECRET: test-jwt-secret-key-12345
          REFRESH_TOKEN_SECRET: test-refresh-token-secret-67890
          ADMIN_ALLOWED_IPS: '127.0.0.1,::1,::ffff:127.0.0.1'

      - name: Inspect E2E Failure
        if: steps.e2e_step.outcome == 'failure'
        run: echo "E2E Failed - check step log above" && exit 1

      - name: Build Backend Application
        run: npm run build:backend

  frontend-test-and-build:
    name: Frontend Test & Build (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test --workspace frontend

      - name: Build Frontend Application
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_API_URL: https://bazaarflow-backend.onrender.com
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_mock
