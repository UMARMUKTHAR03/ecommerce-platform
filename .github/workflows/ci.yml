name: BazaarFlow LUXE CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-build:
    name: Backend Test, E2E & Build (NestJS + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: bazaarflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-12345
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy

      - name: Run Database Migrations on PostgreSQL Service
        run: npm run migration:run
        env:
          DATABASE_URL: postgresql://postgres:testpassword123@localhost:5432/bazaarflow_test
          NODE_ENV: test

      - name: Run Backend E2E Integration Tests
        id: e2e_tests
        run: |
          mkdir -p $GITHUB_WORKSPACE/reports
          npx jest --config ./test/jest-e2e.json --runInBand --verbose --json --outputFile=$GITHUB_WORKSPACE/reports/jest-e2e.json; echo "JEST_EXIT=$?" >> "$GITHUB_ENV"
        working-directory: backend
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:testpassword123@localhost:5432/bazaarflow_test
          NODE_ENV: test
          RUN_E2E: 'true'
          JWT_SECRET: test-jwt-secret-key-12345
          REFRESH_TOKEN_SECRET: test-refresh-token-secret-67890
          ADMIN_ALLOWED_IPS: '127.0.0.1,::1,::ffff:127.0.0.1'

      - name: Print E2E Test Report
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const path = '$GITHUB_WORKSPACE/reports/jest-e2e.json';
            try {
              const res = JSON.parse(fs.readFileSync(path, 'utf8'));
              console.log('=== E2E TEST SUMMARY ===');
              console.log('Total Suites:', res.numTotalTestSuites, '| Passed:', res.numPassedTestSuites, '| Failed:', res.numFailedTestSuites, '| Skipped:', res.numPendingTestSuites);
              console.log('Total Tests:', res.numTotalTests, '| Passed:', res.numPassedTests, '| Failed:', res.numFailedTests, '| Skipped:', res.numPendingTests);
              res.testResults.forEach(suite => {
                console.log('\\nSUITE:', suite.testFilePath, '| status:', suite.status);
                (suite.assertionResults || []).forEach(t => {
                  if (t.status === 'failed') {
                    console.log('  FAIL:', t.fullName);
                    (t.failureMessages || []).forEach(m => console.log('    ', m.substring(0, 1000)));
                  }
                });
              });
            } catch (err) {
              console.log('No JSON report found or parse error:', err.message);
            }
          "
          if [ \"$JEST_EXIT\" != \"0\" ]; then exit 1; fi

      - name: Build Backend Application
        run: npm run build:backend

  frontend-test-and-build:
    name: Frontend Test & Build (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test --workspace frontend

      - name: Build Frontend Application
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_API_URL: https://bazaarflow-backend.onrender.com
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_mock
