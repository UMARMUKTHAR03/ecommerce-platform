name: BazaarFlow LUXE CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-build:
    name: Backend Test & Build (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm run test:backend

      - name: Build Backend Application
        run: npm run build:backend

  frontend-test-and-build:
    name: Frontend Test & Build (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test --workspace frontend

      - name: Build Frontend Application
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_API_URL: https://bazaarflow-backend.onrender.com
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_mock
